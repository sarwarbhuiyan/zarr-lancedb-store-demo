[project]
name = "zarr-lancedb-store-demo"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "h3>=4.5.0",
    "hypothesis>=6.170.1",
    "icechunk>=2.3.0",
    "lancedb>=0.40.0",
    "numpy>=2.5.4",
    "obstore>=0.12.0",
    "pyarrow>=26.0.0",
    "pylance>=13.0.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "s2sphere>=0.2.5",
    "xarray>=2026.9.0",
    "zarr>=3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lance_zarr"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "boto3>=1.43.114",
]


[tool.uv]
# The package mirror rejects a few very recent releases; hold those back.
constraint-dependencies = ["certifi<2026.10.1"]
